<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor Flow 3.0</title><style>*{box-sizing:border-box}body{background:#f5f3ef;color:#171717;font:16px system-ui;max-width:760px;margin:auto;padding:20px}label{display:block;margin:14px 0}input,select,textarea,button{font:inherit;padding:12px;border:1px solid #ccc;border-radius:8px;width:100%}button{background:#171717;color:white;margin:5px 0;cursor:pointer}img{width:100%;aspect-ratio:1;object-fit:cover}#photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}article{background:white;padding:12px;margin:8px 0;border-radius:8px}small{display:block}</style><h1>Editor Flow 3.0</h1><p>Administrá y publicá tus camisetas directamente.</p><p id="status" role="status">Cargando…</p><section id="login"><label>Contraseña de administración<input id="password" type="password" autocomplete="current-password"></label><button id="enter">Ingresar</button></section><section id="panel" hidden><form id="form"><h2 id="heading">Nuevo producto</h2><label>Nombre<input name="name" required></label><label>Categoría<select name="category"><option>Jugador</option><option>Hincha</option><option>Retro</option><option>Utilería</option></select></label><label>Precio ARS<input name="price" type="number" min="0" required></label><label>Talles<input name="sizes"></label><label>Medidas<textarea name="measures"></textarea></label><label>Descripción<textarea name="description"></textarea></label><label>Disponibilidad<select name="stock"><option>Disponible</option><option>Agotado</option><option>Por pedido</option></select></label><label>Agregar fotos (hasta 6)<input id="upload" type="file" accept="image/*" multiple></label><small>Podés agregar fotos de a una o varias juntas. Elegí cuál será la principal.</small><div id="photos"></div><button id="save">Guardar y publicar producto</button><p id="saved" role="status" aria-live="polite"></p><button type="button" id="reset">Nuevo producto / cancelar edición</button></form><h2>Mis productos</h2><div id="list"></div><button id="logout">Cerrar sesión</button></section><script>const $=id=>document.getElementById(id),form=$('form');let data=[],photos=[],editing=null,busy=false,password='';function status(t){$('status').textContent=t}async function api(method='GET',body){let r=await fetch('/api/admin',{method,headers:{Authorization:'Bearer '+password,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});if(!r.ok)throw Error(r.status===401?'Contraseña incorrecta': 'No se pudo completar la operación ('+r.status+')');return r.json()}function reset(){editing=null;photos=[];HTMLFormElement.prototype.reset.call(form);$('heading').textContent='Nuevo producto';preview()}function list(){$('list').replaceChildren();data.forEach(p=>{let a=document.createElement('article');a.textContent=p.name+' · $'+p.price;let b=document.createElement('button');b.textContent='Editar';b.onclick=()=>{if(busy)return;editing=p.id;for(let k of ['name','category','price','sizes','measures','description','stock'])form.elements[k].value=p[k]??'';photos=[...p.photos];$('heading').textContent='Editar producto';preview();form.scrollIntoView()};let c=document.createElement('button');c.textContent='Eliminar';c.onclick=async()=>{if(busy||!confirm('¿Eliminar '+p.name+'?'))return;busy=true;try{data=await api('DELETE',{id:p.id});reset();list();status('Producto eliminado')}catch(e){status(e.message)}finally{busy=false}};a.append(b,c);$('list').append(a)})}function preview(){$('photos').replaceChildren();photos.forEach((src,i)=>{let a=document.createElement('article'),im=document.createElement('img'),b=document.createElement('button'),c=document.createElement('button');im.src=src;b.type=c.type='button';b.textContent=i===0?'Principal':'Hacer principal';b.onclick=()=>{photos.unshift(photos.splice(i,1)[0]);preview()};c.textContent='Quitar';c.onclick=()=>{photos.splice(i,1);preview()};a.append(im,b,c);$('photos').append(a)})}async function compress(file){let url=URL.createObjectURL(file);try{let im=new Image();im.src=url;await im.decode();let scale=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);let out=c.toDataURL('image/jpeg',.75);while(out.length>240000 && c.width>100){let n=document.createElement('canvas');n.width=Math.max(1,Math.round(c.width*.8));n.height=Math.max(1,Math.round(c.height*.8));n.getContext('2d').drawImage(c,0,0,n.width,n.height);c=n;out=c.toDataURL('image/jpeg',.7)}if(out.length>240000)throw Error();return out}finally{URL.revokeObjectURL(url)}}$('upload').onchange=async e=>{if(busy)return;busy=true;$('save').disabled=true;try{let files=[...e.target.files];if(files.length+photos.length>6)alert('Máximo 6 fotos por producto');for(let f of files.slice(0,6-photos.length)){try{photos.push(await compress(f))}catch{alert('No se pudo abrir '+f.name+'. Probá con JPG o PNG.')}}preview()}finally{busy=false;$('save').disabled=false;e.target.value=''}};$('enter').onclick=async()=>{password=$('password').value;try{data=await api();$('login').hidden=true;$('panel').hidden=false;$('password').value='';list();status('Catálogo conectado: '+data.length+' productos')}catch(e){password='';status(e.message)}};$('logout').onclick=()=>{if(busy)return;password='';data=[];reset();list();$('panel').hidden=true;$('login').hidden=false;status('Sesión cerrada')};form.onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('save').disabled=true;$('saved').textContent='Publicando…';try{let p=Object.fromEntries(new FormData(form));p.id=editing;p.price=Number(p.price);p.photos=[...photos];data=await api('POST',p);reset();list();$('saved').textContent='✓ Producto guardado y publicado correctamente.';status('Catálogo conectado: '+data.length+' productos')}catch(e){$('saved').textContent=e.message}finally{busy=false;$('save').disabled=false}};$('reset').onclick=()=>{if(!busy)reset()};status('Ingresá tu contraseña para administrar el catálogo.');</script></html>
