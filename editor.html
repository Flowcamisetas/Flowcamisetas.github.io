<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor Flow 2.0</title><style>*{box-sizing:border-box}body{background:#f5f3ef;color:#171717;font:16px system-ui;max-width:760px;margin:auto;padding:20px}label{display:block;margin:14px 0}input,select,textarea,button{font:inherit;padding:12px;border:1px solid #ccc;border-radius:8px;width:100%}button{background:#171717;color:white;margin:5px 0;cursor:pointer}img{width:100%;aspect-ratio:1;object-fit:cover}#photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}article{background:white;padding:12px;margin:8px 0;border-radius:8px}small{display:block}</style><h1>Editor Flow 2.0</h1><p>El catálogo publicado se carga automáticamente. Guardá los productos y exportá el index.html para subirlo a GitHub.</p><p id="status" role="status">Cargando…</p><label>O importar index.html manualmente<input id="source" type="file" accept=".html"></label><div id="list"></div><form id="form"><h2 id="heading">Nuevo producto</h2><label>Nombre<input name="name" required></label><label>Categoría<select name="category"><option>Jugador</option><option>Hincha</option><option>Retro</option><option>Utilería</option></select></label><label>Precio ARS<input name="price" type="number" min="0" required></label><label>Talles<input name="sizes"></label><label>Medidas<textarea name="measures"></textarea></label><label>Descripción<textarea name="description"></textarea></label><label>Disponibilidad<select name="stock"><option>Disponible</option><option>Agotado</option><option>Por pedido</option></select></label><label>Agregar fotos (hasta 6)<input id="upload" type="file" accept="image/*" multiple></label><small>Podés agregar fotos de a una o varias juntas. Elegí cuál será la principal.</small><div id="photos"></div><button id="save">Guardar producto</button><button type="button" id="reset">Nuevo producto / cancelar edición</button></form><button id="export" disabled>Exportar index.html</button><script>
const $=id=>document.getElementById(id), form=$('form');let html='',data=[],photos=[],editing=-1,busy=false;function status(t){$('status').textContent=t}function load(s){let doc=new DOMParser().parseFromString(s,'text/html'),node=doc.getElementById('catalog-data');if(!node)throw Error('Archivo sin catálogo');let d=JSON.parse(node.textContent);if(!Array.isArray(d))throw Error('Catálogo inválido');html=s;data=d;reset();list();$('export').disabled=false;status('Catálogo cargado: '+data.length+' productos')}function reset(){editing=-1;photos=[];form.reset();$('heading').textContent='Nuevo producto';preview()}function list(){$('list').replaceChildren();data.forEach((p,i)=>{let a=document.createElement('article');a.textContent=p.name+' · $'+p.price;let b=document.createElement('button');b.textContent='Editar';b.onclick=()=>{editing=i;for(let k of ['name','category','price','sizes','measures','description','stock'])form.elements[k].value=p[k]??'';photos=[...(p.photos?.length?p.photos:p.photo?[p.photo]:[])];$('heading').textContent='Editar producto';preview();form.scrollIntoView()};let c=document.createElement('button');c.textContent='Eliminar';c.onclick=()=>{if(confirm('¿Eliminar '+p.name+'?')){data.splice(i,1);reset();list();status('Producto eliminado. Exportá para publicar.')}};a.append(b,c);$('list').append(a)})}function preview(){$('photos').replaceChildren();photos.forEach((src,i)=>{let a=document.createElement('article'),im=document.createElement('img'),b=document.createElement('button'),c=document.createElement('button');im.src=src;b.type=c.type='button';b.textContent=i===0?'Principal':'Hacer principal';b.onclick=()=>{photos.unshift(photos.splice(i,1)[0]);preview()};c.textContent='Quitar';c.onclick=()=>{photos.splice(i,1);preview()};a.append(im,b,c);$('photos').append(a)})}async function compress(file){let url=URL.createObjectURL(file);try{let im=new Image();im.src=url;await im.decode();let scale=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.78)}finally{URL.revokeObjectURL(url)}}$('upload').onchange=async e=>{if(busy)return;busy=true;$('save').disabled=true;try{let files=[...e.target.files];if(files.length+photos.length>6)alert('Máximo 6 fotos por producto');for(let f of files.slice(0,6-photos.length)){try{photos.push(await compress(f))}catch{alert('No se pudo abrir '+f.name+'. Probá con JPG o PNG.')}}preview()}finally{busy=false;$('save').disabled=false;e.target.value=''}};form.onsubmit=e=>{e.preventDefault();if(!html||busy)return alert('Esperá a que se cargue el catálogo');let p=Object.fromEntries(new FormData(form));p.price=Number(p.price);p.photos=[...photos];p.photo=photos[0]||'';if(editing<0)data.push(p);else data[editing]=p;reset();list();status('Producto guardado. Exportá index.html para publicar.');};$('reset').onclick=reset;$('source').onchange=async e=>{try{load(await e.target.files[0].text())}catch(err){status(err.message)}};$('export').onclick=()=>{if(busy)return;let json=JSON.stringify(data).replace(/</g,'\\u003c');let out=html.replace(/(<script\b[^>]*id=["']catalog-data["'][^>]*>)[\s\S]*?(<\/script>)/i,(_,a,b)=>a+json+b);let url=URL.createObjectURL(new Blob([out],{type:'text/html'})),a=document.createElement('a');a.href=url;a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)};fetch('./index.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.text()}).then(load).catch(()=>status('No se pudo cargar automáticamente. Importá el index.html manualmente.'));
</script></html>
