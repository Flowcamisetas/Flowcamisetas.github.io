<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor Flow</title><style>body{font:16px system-ui;max-width:700px;margin:auto;padding:20px;background:#f5f3ef}label{display:block;margin:12px 0}input,select,textarea,button{font:inherit;padding:10px;box-sizing:border-box;width:100%}button{background:#171717;color:white;border:0;border-radius:6px;margin:5px 0}article{padding:12px;background:white;margin:12px 0}</style><h1>Editor de catálogo Flow</h1><p>1. Abrí el archivo index.html vigente. 2. Editá productos. 3. Exportá y reemplazá index.html en GitHub. Los cambios no se publican automáticamente.</p><input type="file" id="source" accept=".html"><div id="status"></div><form id="form"><label>Nombre<input name="name" required></label><label>Categoría<select name="category"><option>Jugador</option><option>Hincha</option><option>Retro</option><option>Utilería</option></select></label><label>Precio ARS<input name="price" type="number" min="0" required></label><label>Talles<input name="sizes"></label><label>Medidas<textarea name="measures"></textarea></label><label>Descripción<textarea name="description"></textarea></label><label>Disponibilidad<select name="stock"><option>Disponible</option><option>Consultar stock</option><option>Agotado</option></select></label><label>Foto (opcional, conserva la anterior si no elegís otra)<input id="photo" type="file" accept="image/*"></label><button>Guardar producto</button></form><div id="list"></div><button id="export">Exportar index.html</button><script>let template='',rows=[],editing=-1;const $=id=>document.getElementById(id),f=$('form');$('source').onchange=async()=>{try{template=await $('source').files[0].text();let doc=new DOMParser().parseFromString(template,'text/html');rows=JSON.parse(doc.getElementById('catalog-data').textContent);editing=-1;f.reset();draw();$('status').textContent='Catálogo cargado'}catch(e){template='';alert('Archivo no válido')}};function draw(){$('list').replaceChildren();rows.forEach((p,i)=>{let a=document.createElement('article');a.textContent=p.name+' — $'+p.price;for(let action of ['Editar','Eliminar']){let b=document.createElement('button');b.textContent=action;b.onclick=()=>{if(action==='Eliminar'){if(confirm('¿Eliminar producto?')){rows.splice(i,1);editing=-1;f.reset();draw()}}else{editing=i;for(let k of ['name','category','price','sizes','measures','description','stock'])f.elements[k].value=p[k]||'';window.scrollTo(0,0)}};a.append(b)}$('list').append(a)})}f.onsubmit=async e=>{e.preventDefault();if(!template)return alert('Primero abrí index.html');let p=Object.fromEntries(new FormData(f));p.photo=editing>=0?rows[editing].photo:'';let file=$('photo').files[0];if(file){try{let img=await createImageBitmap(file);let c=document.createElement('canvas'),scale=Math.min(1,900/Math.max(img.width,img.height));c.width=img.width*scale;c.height=img.height*scale;c.getContext('2d').drawImage(img,0,0,c.width,c.height);p.photo=c.toDataURL('image/jpeg',.8)}catch(e){return alert('No se pudo abrir la foto')}}if(editing<0)rows.push(p);else rows[editing]=p;editing=-1;f.reset();draw()};$('export').onclick=()=>{if(!template)return alert('Primero abrí index.html');let safe=JSON.stringify(rows).replace(/</g,'\u003c');let out=template.replace(/(<script id="catalog-data" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+safe+b);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/html'}));a.download='index.html';a.click()};</script></html>
